name: VECTRA CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integrity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Validate Backend Dependencies
        working-directory: Backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: Frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: Frontend
        env:
          VITE_API_URL: https://vectra-backend-docker.onrender.com/api/v1
          VITE_BACKEND_URL: https://vectra-backend-docker.onrender.com
        run: npm run build

  production-deployment:
    needs: integrity-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Deployment Webhooks Are Configured
        env:
          RENDER_DEPLOY_WEBHOOK: ${{ secrets.RENDER_DEPLOY_WEBHOOK }}
          VERCEL_DEPLOY_WEBHOOK: ${{ secrets.VERCEL_DEPLOY_WEBHOOK }}
        run: |
          test -n "$RENDER_DEPLOY_WEBHOOK" || { echo "::error::RENDER_DEPLOY_WEBHOOK is not configured"; exit 1; }
          test -n "$VERCEL_DEPLOY_WEBHOOK" || { echo "::error::VERCEL_DEPLOY_WEBHOOK is not configured"; exit 1; }

      - name: Trigger Live Render Backend Container Rebuild
        env:
          RENDER_DEPLOY_WEBHOOK: ${{ secrets.RENDER_DEPLOY_WEBHOOK }}
        run: curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_WEBHOOK"

      - name: Trigger Live Vercel Frontend Production Compile
        env:
          VERCEL_DEPLOY_WEBHOOK: ${{ secrets.VERCEL_DEPLOY_WEBHOOK }}
        run: curl --fail --show-error --silent --request POST "$VERCEL_DEPLOY_WEBHOOK"
